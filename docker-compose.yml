version: "3.9"

services:
  raid-helper:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: discord-raid-helper
    env_file:
      - .env
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - ./.data:/app/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s